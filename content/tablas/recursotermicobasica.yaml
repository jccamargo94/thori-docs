id: recursotermicobasica
nombre: recursoTermicoBasica
familia: recursos-termicos
titulo: Recursos térmicos
descripcion: >
  Información básica de los recursos de generación térmicos: el tipo de
  combustible que usan, sus factores de disponibilidad y de consumo, sus
  límites de generación, el costo variable, la empresa propietaria y las
  banderas que definen si el recurso es obligatorio, si tiene consumo
  variable con la generación o si participa en el modelo de Cournot (no
  funcional en esta versión). Los valores no varían por etapa; la variante
  por etapa está en recursotermicoperiodo.
estado: sin-verificar
manual: "9.1"
campos:
  - nombre: nombre
    tipo: string
    unidad: null
    requerido: true
    descripcion: Nombre del recurso de generación térmico.
    referencia: null
  - nombre: tipo
    tipo: string
    unidad: null
    requerido: true
    descripcion: >
      Código del tipo de combustible que usa el recurso, para reportes: TL,
      TG o TC.
    referencia: null
  - nombre: factordisponibilidad
    tipo: double
    unidad: null
    requerido: true
    descripcion: Factor entre 0 y 1 que derratea (reduce) la capacidad máxima del recurso.
    referencia: null
  - nombre: factorconsumopromedio
    tipo: double
    unidad: MBTU/MWh
    requerido: true
    descripcion: Factor de consumo promedio de combustible del recurso, por unidad de energía generada.
    referencia: null
  - nombre: minimo
    tipo: double
    unidad: null
    requerido: true
    descripcion: >
      Mínimo de generación del recurso térmico; solo se aplica cuando la
      bandera obligatorio vale 1.
    referencia: null
  - nombre: maximo
    tipo: double
    unidad: null
    requerido: true
    descripcion: Máximo de generación del recurso térmico.
    referencia: null
  - nombre: costovariable
    tipo: double
    unidad: $/MWh
    requerido: true
    descripcion: Costo variable asociado a la generación del recurso térmico.
    referencia: null
  - nombre: factorconcumovariable
    tipo: integer
    unidad: null
    requerido: true
    descripcion: >
      Bandera 1/0 que indica si el recurso tiene factor de consumo variable
      con la generación; la curva de ese factor se define en
      recursotermicovariable.
    referencia: null
  - nombre: obligatorio
    tipo: integer
    unidad: null
    requerido: true
    descripcion: >
      Bandera 1/0 que indica si el recurso es obligatorio; un recurso
      obligatorio se despacha al menos en su valor mínimo.
    referencia: null
  - nombre: empresa
    tipo: string
    unidad: null
    requerido: true
    descripcion: Nombre de la empresa dueña del recurso de generación térmico.
    referencia: empresabasica.nombre
  - nombre: etapaentrada
    tipo: integer
    unidad: null
    requerido: true
    descripcion: >
      Valor indicativo de que el recurso es futuro; cuando aplica, la fecha
      de entrada se define en la tabla fechaentrada.
    referencia: null
  - nombre: subarea
    tipo: string
    unidad: null
    requerido: true
    descripcion: Subárea a la que pertenece la empresa dueña del recurso.
    referencia: null
  - nombre: combustible
    tipo: string
    unidad: null
    requerido: true
    descripcion: >
      Tipo de combustible asociado al recurso; distinto del campo tipo, que
      usa los códigos abreviados TL, TG y TC.
    referencia: null
  - nombre: modelocournot
    tipo: integer
    unidad: null
    requerido: false
    descripcion: >
      Bandera para activar el recurso en el modelo de competencia de Cournot;
      esta opción no es funcional en esta versión.
    referencia: null
  - nombre: escenario
    tipo: integer
    unidad: null
    requerido: true
    descripcion: >
      Identificador del escenario a modelar; debe ser un número consecutivo.
    referencia: null
