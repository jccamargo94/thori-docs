id: recursohidroperiodo
nombre: recursoHidroPeriodo
familia: recursos-hidraulicos
titulo: Recursos de generación hidráulicos por etapa
descripcion: >
  Información de los recursos de generación hidráulicos que puede variar de
  una etapa de optimización a otra: costo variable, límites de generación y
  la bandera de recurso obligatorio. Es la contraparte por etapa de
  recursohidrobasica.
estado: sin-verificar
manual: "8.2"
campos:
  - nombre: nombre
    tipo: string
    unidad: null
    requerido: true
    descripcion: Nombre del recurso de generación hidráulico.
    referencia: recursohidrobasica.nombre
  - nombre: periodo
    tipo: integer
    unidad: null
    requerido: true
    descripcion: Etapa del horizonte de optimización a la que aplica el registro.
    referencia: periodobasica.nombre
  - nombre: costovariable
    tipo: double
    unidad: $/MWh
    requerido: true
    descripcion: Costo variable asociado al recurso de generación hidráulico en la etapa.
    referencia: null
  - nombre: minimo
    tipo: double
    unidad: null
    requerido: true
    descripcion: >
      Mínimo del recurso de generación en la etapa. Solo lo utiliza el modelo
      si la bandera obligatorio vale 1.
    referencia: null
  - nombre: maximo
    tipo: double
    unidad: null
    requerido: true
    descripcion: Máximo del recurso de generación hidráulico en la etapa.
    referencia: null
  - nombre: obligatorio
    tipo: integer
    unidad: null
    requerido: true
    descripcion: >
      Bandera 1/0 que indica si el recurso es obligatorio en la etapa; un
      recurso obligatorio se despacha al menos en su valor mínimo.
    referencia: null
  - nombre: escenario
    tipo: integer
    unidad: null
    requerido: true
    descripcion: >
      Identificador del escenario a modelar; debe ser un número consecutivo.
    referencia: null
