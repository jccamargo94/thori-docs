id: recursonoconvencionalbasica
nombre: recursoNoConvencionalBasica
familia: recursos-no-convencionales
titulo: Recursos de generación no convencionales
descripcion: >
  Información básica de los recursos de generación con fuentes renovables
  (biomasa, eólica, geotérmica, solar o generación menor de filo de agua) que
  no tienen combustible asociado ni topología hidráulica. Incluye su
  capacidad máxima, la empresa dueña y las banderas para modelar su entrada
  futura. Los valores de esta tabla no varían por etapa; la variante por
  etapa está en recursonoconvencionalperiodo.
estado: sin-verificar
manual: "13.1"
campos:
  - nombre: nombre
    tipo: string
    unidad: null
    requerido: true
    descripcion: Nombre del recurso de generación no convencional.
    referencia: null
  - nombre: tipo
    tipo: string
    unidad: null
    requerido: true
    descripcion: >
      Tecnología del recurso no convencional, solo para reportes: BIOMASA,
      EOLICA, GEOTERMICA, MENOR (generación menor de filo de agua u otra
      tecnología no cubierta por las demás) o SOLAR.
    referencia: null
  - nombre: maximo
    tipo: double
    unidad: null
    requerido: true
    descripcion: Capacidad máxima del recurso de generación no convencional.
    referencia: null
  - nombre: factorplanta
    tipo: double
    unidad: null
    requerido: true
    descripcion: >
      Factor entre 0 y 1 para derratear la capacidad máxima del recurso; la
      capacidad máxima se multiplica por este factor.
    referencia: null
  - nombre: empresa
    tipo: string
    unidad: null
    requerido: true
    descripcion: Nombre de la empresa dueña del recurso de generación no convencional.
    referencia: empresabasica.nombre
  - nombre: etapaentrada
    tipo: integer
    unidad: null
    requerido: true
    descripcion: >
      Bandera indicativa de que el recurso es futuro y aún no opera; cuando lo
      es, su fecha real de entrada debe configurarse en fechaentrada.
    referencia: null
  - nombre: subarea
    tipo: string
    unidad: null
    requerido: true
    descripcion: Subárea a la que pertenece la empresa dueña del recurso.
    referencia: null
  - nombre: escenario
    tipo: integer
    unidad: null
    requerido: true
    descripcion: >
      Identificador del escenario a modelar; debe ser un número consecutivo.
    referencia: null
