id: embalseperiodo
nombre: embalsePeriodo
familia: red-hidraulica
titulo: Embalses por etapa
descripcion: >
  Información de los embalses que puede variar de una etapa de optimización
  a otra: volúmenes mínimo y máximo, y filtración. Es la contraparte por
  etapa de embalsebasica.
estado: sin-verificar
manual: "11.5"
campos:
  - nombre: nombre
    tipo: string
    unidad: null
    requerido: true
    descripcion: Nombre del embalse.
    referencia: embalsebasica.nombre
  - nombre: periodo
    tipo: integer
    unidad: null
    requerido: true
    descripcion: Etapa del horizonte de optimización.
    referencia: periodobasica.nombre
  - nombre: volminimo
    tipo: double
    unidad: Hm3
    requerido: true
    descripcion: Volumen mínimo del embalse en la etapa.
    referencia: null
  - nombre: volmaximo
    tipo: double
    unidad: Hm3
    requerido: true
    descripcion: Volumen máximo del embalse en la etapa.
    referencia: null
  - nombre: filtracion
    tipo: double
    unidad: m3/s
    requerido: true
    descripcion: Filtración del embalse en la etapa; es una pérdida de caudal.
    referencia: null
  - nombre: escenario
    tipo: integer
    unidad: null
    requerido: true
    descripcion: >
      Identificador del escenario a modelar; debe ser un número consecutivo.
    referencia: null
