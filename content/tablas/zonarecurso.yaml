id: zonarecurso
nombre: zonaRecurso
familia: zonas
titulo: Recursos por zona de seguridad
descripcion: >
  Asocia cada recurso de generación con la zona de seguridad a la que
  pertenece, de modo que el límite definido en zonabasica o zonaperiodo se
  calcule sobre la generación conjunta de todos los recursos asignados a esa
  zona.
estado: sin-verificar
manual: "12.3"
campos:
  - nombre: nombre
    tipo: string
    unidad: null
    requerido: true
    descripcion: Nombre de la zona de seguridad.
    referencia: zonabasica.nombre
  - nombre: recurso
    tipo: string
    unidad: null
    requerido: true
    descripcion: >
      Nombre del recurso de generación que pertenece a la zona de seguridad.
      Puede ser un recurso hidráulico, térmico o no convencional; el manual no
      distingue de cuál de las tres tablas básicas proviene, así que no se
      documenta como una referencia a una sola tabla.
    referencia: null
