id: recursonocobloque
nombre: recursoNoCoBloque
familia: recursos-no-convencionales
titulo: Perfil de generación no convencional por bloque
descripcion: >
  Ajusta la generación de los recursos no convencionales por bloque de
  demanda dentro de cada etapa, con un factor reductor que se multiplica sobre
  el factorplanta ya definido en recursonoconvencionalbasica o
  recursonoconvencionalperiodo. Está pensada sobre todo para modelar el
  perfil horario de la generación solar, que solo genera en ciertos bloques
  del día.
estado: sin-verificar
manual: "13.3"
campos:
  - nombre: tipo
    tipo: string
    unidad: null
    requerido: true
    descripcion: >
      Tecnología del recurso de generación no convencional a la que aplica el
      perfil: EOLICA, SOLAR, MENOR, entre otras. El perfil se comparte entre
      todos los recursos de esa tecnología, no se define recurso por recurso.
    referencia: null
  - nombre: bloque
    tipo: integer
    unidad: null
    requerido: true
    descripcion: Bloque de demanda al que aplica el factor.
    referencia: bloquebasica.nombre
  - nombre: periodo
    tipo: integer
    unidad: null
    requerido: true
    descripcion: Etapa de optimización a la que aplica el factor.
    referencia: periodobasica.nombre
  - nombre: factorreductor
    tipo: double
    unidad: null
    requerido: true
    descripcion: >
      Factor entre 0 y 1 para derratear la capacidad máxima en el bloque;
      normalmente se configura en 0 o 1 para indicar si la tecnología genera o
      no en ese bloque de demanda. Se multiplica junto con el factorplanta de
      recursonoconvencionalbasica o recursonoconvencionalperiodo.
    referencia: null
